# Installed to /etc/systemd/networkd.conf.d/.
# By default systemd-networkd deletes routes and routing-policy rules it did not
# create whenever it restarts (e.g. after an unattended systemd upgrade). That
# wiped wg-quick's WARP rules and cut off IPv4, so leave foreign entries alone.
[Network]
ManageForeignRoutingPolicyRules=no
ManageForeignRoutes=no
